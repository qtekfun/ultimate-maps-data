name: Weekly data release

# Builds the Spain region data (PMTiles for rendering + CoMaps .mwm for search/routing) plus the world base,
# publishes it as a GitHub Release and keeps only the two newest data releases.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      protomaps_date:
        description: "Protomaps build date (YYYYMMDD); default: yesterday"
        required: false
      tag_suffix:
        description: "Optional suffix for the release tag (e.g. -b), to publish again for the same dates"
        required: false
      dry_run:
        description: "Dry run: build everything but do not create or prune any release; the small outputs (catalog, checksums, transit index and reports) are kept as a workflow artifact"
        type: boolean
        default: false
      app_ref:
        description: "Ref (branch, tag or commit) of qtekfun/UltimateMaps that supplies the converters; default: its default branch"
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-data
  cancel-in-progress: false

env:
  PMTILES_VERSION: "1.31.2"
  CDN: "https://cdn-fi-1.comaps.app/maps" # a mirror from CoMaps private.h; cdn-us-1 did not serve the files
  KEEP_RELEASES: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: sudo rm -rf /opt/ghc /usr/share/dotnet && df -h /

      - uses: actions/checkout@v4
        with:
          path: data

      - name: Project scripts
        uses: actions/checkout@v4
        with:
          repository: qtekfun/UltimateMaps
          path: app
          ref: ${{ github.event.inputs.app_ref }}

      - name: Latest CoMaps tag (borders and region hierarchy)
        run: |
          TAG=$(git ls-remote --tags --refs https://codeberg.org/comaps/comaps 'v20*' | sed 's|.*refs/tags/||' | sort -V | tail -1)
          echo "CoMaps tag: $TAG"
          mkdir -p app/third_party
          git clone --depth 1 --branch "$TAG" --filter=blob:none --sparse https://codeberg.org/comaps/comaps app/third_party/comaps
          git -C app/third_party/comaps sparse-checkout set --no-cone /data/borders/ /data/countries.txt
          ls app/third_party/comaps/data | head
          echo "COMAPS_TAG=$TAG" >> "$GITHUB_ENV"

      - name: go-pmtiles
        run: |
          curl -sL "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES_VERSION}/go-pmtiles_${PMTILES_VERSION}_Linux_x86_64.tar.gz" | tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/pmtiles" version

      - name: Resolve versions
        run: |
          PM_DATE="${{ github.event.inputs.protomaps_date }}"
          [ -n "$PM_DATE" ] || PM_DATE=$(date -u -d yesterday +%Y%m%d)
          MWM_V=$(python3 -c "import json;print(json.load(open('app/third_party/comaps/data/countries.txt'))['v'])")
          TAG="data-${MWM_V}-${PM_DATE}${{ github.event.inputs.tag_suffix }}"
          # A dry run never collides with (or is skipped because of) a real release of the same dates.
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then TAG="${TAG}-dryrun"; echo "DRY_RUN=1" >> "$GITHUB_ENV"; fi
          MAP_SERIES=$(python3 -c "import json;print(json.load(open('app/third_party/comaps/data/countries.txt'))['map_series'])")
          echo "MAP_SERIES=$MAP_SERIES" >> "$GITHUB_ENV"
          echo "PM_DATE=$PM_DATE" >> "$GITHUB_ENV"; echo "MWM_V=$MWM_V" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          curl -sfI "https://build.protomaps.com/${PM_DATE}.pmtiles" >/dev/null || { echo "Protomaps build $PM_DATE not found"; exit 1; }
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then echo "EXISTS=1" >> "$GITHUB_ENV"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-java@v4
        if: env.EXISTS != '1'
        with:
          distribution: temurin
          java-version: "21"

      # The app's Gradle settings include the shared map viewer (`:mapcore`) from the git submodule `ultimate-mapcore`;
      # a plain checkout leaves that directory empty and every Gradle build then fails while configuring the project
      # ("Configuring project ':mapcore' without an existing directory"). Only that submodule is fetched (at the commit the
      # app pins); the CoMaps submodule is not needed by the transit tool.
      - name: Gradle prerequisites for the transit builder (ultimate-mapcore submodule)
        if: env.EXISTS != '1'
        continue-on-error: true
        run: |
          git -C app submodule update --init --depth 1 ultimate-mapcore
          ls app/ultimate-mapcore/mapcore | head -3

      # Madrid public-transport index: CRTM (Metro, Metro Ligero, EMT, interurban and other urban buses) and Renfe
      # Cercanias feeds (URLs: docs/phase2/transit.md section 6 of the app repo; manifest scripts/transit/madrid.json,
      # which also holds the attribution strings that end up in the catalog). Failure policy: a transit problem NEVER
      # blocks the map data release. Any failure (download, build, sanity gate) is logged as a warning and summarised,
      # and the release goes out without a `transit` entry, so the indexes already installed on phones stay usable.
      # A build that passes the gate is always published (asset + catalog entry + SHA256SUMS).
      - name: Public-transport index for Madrid (optional; its feeds only last about 30 days)
        if: env.EXISTS != '1'
        continue-on-error: true
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: |
          set -o pipefail
          S="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### Madrid transit index"
            echo
          } >> "$S"
          skip() {
            echo "::warning::Madrid transit index NOT published this week: $1 (the map data release continues without it)"
            echo "Madrid transit index **not published**: $1" >> "$S"
            exit 0
          }
          mkdir -p out transit-in transit-out
          rm -f out/transit-madrid.umti out/transit-madrid.json
          [ -f app/scripts/build-transit.sh ] || skip "build-transit.sh not available in the app repo"
          [ -d app/ultimate-mapcore/mapcore ] || skip "the ultimate-mapcore submodule is missing, Gradle cannot configure the app project"
          (
            cd transit-in
            get() { curl -fsSL --connect-timeout 30 --max-time 900 --retry 3 -o "$1" "$2" || { echo "::warning::download failed: $1"; rm -f "$1"; }; }
            get crtm_metro.zip        "http://crtm.maps.arcgis.com/sharing/rest/content/items/5c7f2951962540d69ffe8f640d94c246/data"
            get crtm_metroligero.zip  "http://crtm.maps.arcgis.com/sharing/rest/content/items/aaed26cc0ff64b0c947ac0bc3e033196/data"
            get crtm_emt.zip          "http://crtm.maps.arcgis.com/sharing/rest/content/items/868df0e58fca47e79b942902dffd7da0/data"
            get crtm_interurban.zip   "http://crtm.maps.arcgis.com/sharing/rest/content/items/885399f83408473c8d815e40c5e702b7/data"
            get crtm_urban_other.zip  "http://crtm.maps.arcgis.com/sharing/rest/content/items/357e63c2904f43aeb5d8a267a64346d8/data"
            get renfe_cercanias.zip   "https://ssl.renfe.com/ftransit/Fichero_CER_FOMENTO/fomento_transit.zip"
            ls -l
          )
          # The CRTM portal copy of the Metro feed expired on 2026-05-27 and is no longer updated. The NAP copy (file 1134,
          # needs the ApiKey) replaces crtm_metro.zip only when it downloads as a good zip; the builder skips an expired one
          # (or, for this feed, projects its weekly pattern: manifest `projectCalendar`).
          if [ -n "$NAP_API_KEY" ] && [ -f app/scripts/nap-fetch.py ]; then
            python3 -I app/scripts/nap-fetch.py app/scripts/transit/madrid.json transit-in || true
          else
            echo "::warning::NAP_API_KEY or nap-fetch.py not available; Madrid Metro stays on the CRTM portal copy"
          fi
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > app/local.properties
          # The build date is today (UTC): feeds whose calendar ended before it are left out and reported.
          if ! app/scripts/build-transit.sh app/scripts/transit/madrid.json transit-in transit-out "$(date -u +%F)" 2>&1 | tee transit-build.log; then
            skip "the builder failed (see the step log)"
          fi
          ls -l transit-out
          [ -f transit-out/transit-madrid.umti ] && [ -f transit-out/transit-madrid.json ] || skip "the builder produced no index (every feed missing or expired?)"
          if ! python3 -I data/scripts/check-transit.py --umti transit-out/transit-madrid.umti --meta transit-out/transit-madrid.json --log transit-build.log | tee transit-gate.log; then
            skip "the sanity gate rejected the index: $(grep '^ERROR' transit-gate.log | head -3 | tr '\n' ';')"
          fi
          cp transit-out/transit-madrid.umti transit-out/transit-madrid.json out/
          cp transit-out/transit-madrid.json transit-madrid-report.json
          {
            echo "Madrid transit index **built and kept for publication**: $(stat -c %s out/transit-madrid.umti) bytes, $(grep -o 'stops=[0-9]* lines=[0-9]*' transit-build.log | head -1)."
            echo
            grep -E '^(warning|ERROR)' transit-gate.log | sed 's/^/- /'
          } >> "$S"

      # More cities from the Spanish National Access Point (NAP, nap.transportes.gob.es), one index per city config
      # (app/scripts/transit/<city>.json with a `nap` file id per feed). The download needs the HTTP header
      # `ApiKey: <key>`; the key is the repository secret NAP_API_KEY (never echoed). Nothing here can break the release:
      # the step is continue-on-error, a city without a downloaded feed is skipped, feeds whose calendar ended before
      # today are skipped by the builder, and a city whose build fails is reported and left out of the catalog.
      - name: Public-transport indexes from the Spanish NAP (optional; every feed and city may fail on its own)
        if: env.EXISTS != '1'
        continue-on-error: true
        env:
          NAP_API_KEY: ${{ secrets.NAP_API_KEY }}
        run: |
          S="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo "### NAP transit feeds"
            echo
            echo "| city | feed | download | detail |"
            echo "| --- | --- | --- | --- |"
          } >> "$S"
          if [ ! -f app/scripts/nap-fetch.py ] || [ ! -f app/scripts/build-transit.sh ]; then
            echo "NAP scripts not available in the app repo yet; skipping"; echo "| - | - | skipped | scripts missing in the app repo |" >> "$S"; exit 0
          fi
          if [ -z "$NAP_API_KEY" ]; then
            echo "::warning::secret NAP_API_KEY is not set; the NAP cities are skipped"; echo "| - | - | skipped | NAP_API_KEY is not set |" >> "$S"; exit 0
          fi
          mkdir -p out
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > app/local.properties
          built=""; failed=""
          for m in app/scripts/transit/*.json; do
            id=$(basename "$m" .json)
            grep -q '"nap"' "$m" || continue
            [ "$id" = madrid ] && continue  # Madrid has its own step above (only its Metro feed comes from the NAP)
            in="transit-nap-in/$id"; outd="transit-nap-out/$id"
            python3 -I app/scripts/nap-fetch.py "$m" "$in" || true
            if ! ls "$in"/*.zip >/dev/null 2>&1; then
              echo "::warning::$id: no feed could be downloaded; city skipped"; failed="$failed $id"; continue
            fi
            if app/scripts/build-transit.sh "$m" "$in" "$outd" && [ -f "$outd/transit-$id.umti" ]; then
              cp "$outd/transit-$id.umti" "$outd/transit-$id.json" out/
              valid=$(python3 -I -c "import json,sys;m=json.load(open(sys.argv[1]));print(m['validFrom'],'to',m['validTo'])" "$outd/transit-$id.json")
              echo "| $id | index | built | valid $valid, $(stat -c %s "$outd/transit-$id.umti") bytes |" >> "$S"
              built="$built $id"
            else
              echo "::warning::$id: the index could not be built (all feeds expired or unreadable); city skipped"
              echo "| $id | index | FAILED | build failed or every feed expired |" >> "$S"
              failed="$failed $id"
            fi
          done
          echo "NAP cities built:${built:- none}; skipped or failed:${failed:- none}"
          echo "" >> "$S"; echo "Built:${built:- none}. Skipped or failed:${failed:- none}." >> "$S"

      - name: Free disk space (the Android SDK is only needed by the transit tool)
        if: env.EXISTS != '1'
        run: sudo rm -rf /usr/local/lib/android && df -h /

      - name: Spain PMTiles (one per region)
        if: env.EXISTS != '1'
        run: |
          mkdir -p out
          python3 -I app/scripts/split-pmtiles.py --pmtiles "$RUNNER_TEMP/pmtiles" \
            --source "https://build.protomaps.com/${PM_DATE}.pmtiles" --out out --prefix Spain_
          # world base: low zoom, whole planet
          "$RUNNER_TEMP/pmtiles" extract "https://build.protomaps.com/${PM_DATE}.pmtiles" out/world-base.pmtiles --maxzoom=6

      - name: Spain .mwm and world base .mwm from the CoMaps CDN
        if: env.EXISTS != '1'
        run: |
          mkdir -p out mwm
          for f in World WorldCoasts; do curl -sfL --connect-timeout 30 --max-time 900 --retry 3 -o "out/$f.mwm" "$CDN/$MAP_SERIES/$MWM_V/$f.mwm"; done
          for p in app/third_party/comaps/data/borders/Spain_*.poly; do
            id=$(basename "$p" .poly)
            slug=$(python3 -I -c "import importlib.util,sys;s=importlib.util.spec_from_file_location('g','app/scripts/gen-region-catalog.py');m=importlib.util.module_from_spec(s);s.loader.exec_module(m);print(m.slug(sys.argv[1]))" "$id")
            # The catalog reads <comapsId>.mwm; the release asset uses the slug (GitHub renames spaces).
            if curl -sfL --connect-timeout 30 --max-time 900 --retry 3 -o "mwm/$id.mwm" "$CDN/$MAP_SERIES/$MWM_V/${id// /%20}.mwm"; then ln "mwm/$id.mwm" "out/$slug.mwm"; else echo "missing $id"; rm -f "mwm/$id.mwm"; fi
          done
          # A mirror may answer 200 with an HTML page for files it does not hold: check what was downloaded.
          bad=0
          for f in out/*.mwm; do
            if [ "$(stat -c %s "$f")" -lt 100000 ] || head -c 1 "$f" | grep -q '<'; then echo "not a map: $f"; bad=1; fi
          done
          [ "$bad" = 0 ] || exit 1
          ls out | wc -l; du -sh out

      - name: Speed cameras file (optional; skipped while the converter is not on the app's default branch)
        if: env.EXISTS != '1'
        continue-on-error: true
        run: |
          if [ ! -f app/scripts/build-cameras.py ]; then echo "build-cameras.py not available yet; skipping"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool poppler-utils
          mkdir -p cams
          cd cams
          ARGS=""
          UA="Mozilla/5.0"
          get() { curl -sSL --compressed --connect-timeout 30 --max-time 600 --retry 3 -o "$1" "$2"; }
          get radares.xml   https://nap.dgt.es/datex2/dgt/PredefinedLocationsPublication/radares/content.xml || true
          get situations.xml https://nap.dgt.es/datex2/v3/dgt/SituationPublication/datex2_v37.xml || true
          get camaras.xml   https://nap.dgt.es/datex2/v3/dgt/DevicePublication/camaras_datex2_v37.xml || true
          get vms.xml       https://nap.dgt.es/datex2/v3/dgt/DevicePublication/vms_datex2_v37.xml || true
          [ -s radares.xml ] && ARGS="$ARGS --dgt-radars radares.xml"
          ANCH=""; for f in situations.xml camaras.xml vms.xml; do [ -s $f ] && ANCH="$ANCH $f"; done
          [ -n "$ANCH" ] && ARGS="$ARGS --dgt-anchors$ANCH"
          # The report (mobile-radar zones): its file name changes with the date, so take the link from the DGT page.
          PAGE=https://www.dgt.es/conoce-el-estado-del-trafico/vigilancia-y-control/equipos-y-tramos-de-vigilancia/
          LINK=$(curl -sSL -A "$UA" "$PAGE" | grep -o 'href="[^"]*INFORME_CINEMOMETROS[^"]*pdf"' | head -1 | sed 's/href="//;s/"$//')
          if [ -n "$LINK" ] && curl -sSL -A "$UA" -o informe.pdf "https://www.dgt.es$LINK" && pdftotext -layout informe.pdf informe.txt; then ARGS="$ARGS --dgt-report informe.txt"; fi
          curl -sSL --connect-timeout 30 --max-time 1800 --retry 3 -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          osmium tags-filter spain.osm.pbf n/highway=speed_camera -o cams.osm.pbf --overwrite
          osmium export -f geojsonseq cams.osm.pbf -o cams.geojsonseq --overwrite
          rm -f spain.osm.pbf
          ARGS="$ARGS --osm-geojsonseq cams.geojsonseq"
          python3 -I ../app/scripts/build-cameras.py $ARGS --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../out/speedcams-es.bin --summary ../speedcams-summary.json
          cat ../speedcams-summary.json

      - name: EV chargers file (optional; skipped while the converter is not on the app's default branch)
        if: env.EXISTS != '1'
        continue-on-error: true
        run: |
          if [ ! -f app/scripts/build-chargers.py ]; then echo "build-chargers.py not available; skipping"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p chargers
          cd chargers
          curl -sSL --connect-timeout 30 --max-time 1800 --retry 3 -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          osmium tags-filter spain.osm.pbf nw/amenity=charging_station -o chargers.osm.pbf --overwrite
          osmium export -f geojsonseq chargers.osm.pbf -o chargers.geojsonseq --overwrite
          rm -f spain.osm.pbf
          python3 -I ../app/scripts/build-chargers.py --osm-geojsonseq chargers.geojsonseq --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../out/chargers-es.bin --summary ../chargers-summary.json
          cat ../chargers-summary.json

      - name: Low-emission zones file (optional; skipped while the converter is not on the app's default branch)
        if: env.EXISTS != '1'
        continue-on-error: true
        run: |
          if [ ! -f app/scripts/build-zbe.py ]; then echo "build-zbe.py not available; skipping"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p zbe
          cd zbe
          curl -sSL --connect-timeout 30 --max-time 1800 --retry 3 -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          # Only boundary=low_emission_zone on ways and relations (see docs/phase2/zbe-data.md in the app repo).
          osmium tags-filter spain.osm.pbf wr/boundary=low_emission_zone -o zbe.osm.pbf --overwrite
          osmium export -f geojsonseq --geometry-types=polygon,linestring zbe.osm.pbf -o zbe.geojsonseq --overwrite
          rm -f spain.osm.pbf
          python3 -I ../app/scripts/build-zbe.py --osm-geojsonseq zbe.geojsonseq --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../out/zbe-es.bin --summary ../zbe-summary.json
          cat ../zbe-summary.json
          # An empty file is useless and would only make the app say "0 zones": do not publish it.
          python3 -I -c "import json,sys; sys.exit(0 if json.load(open('../zbe-summary.json'))['zones'] > 0 else 1)" || { echo "no zones found; not publishing zbe-es.bin"; rm -f ../out/zbe-es.bin; }

      - name: Hiking and cycling routes file (optional; skipped while the converter is not on the app's default branch)
        if: env.EXISTS != '1'
        continue-on-error: true
        run: |
          if [ ! -f app/scripts/build-routes.py ]; then echo "build-routes.py not available; skipping"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          mkdir -p routes
          cd routes
          curl -sSL --connect-timeout 30 --max-time 1800 --retry 3 -o spain.osm.pbf https://download.geofabrik.de/europe/spain-latest.osm.pbf
          # Route relations with their member ways and nodes (osmium keeps the referenced objects unless -R is given).
          osmium tags-filter spain.osm.pbf r/route=hiking,foot,bicycle,mtb -o routes.osm.pbf --overwrite
          rm -f spain.osm.pbf
          # Closed ways (loops) must come out as lines, not areas, and untagged member ways must not be dropped.
          echo '{"linear_tags": true, "area_tags": false}' > export.json
          osmium export -c export.json -n -u type_id --geometry-types=linestring -f geojsonseq routes.osm.pbf -o ways.geojsonseq --overwrite
          osmium cat -t relation -f opl routes.osm.pbf -o relations.opl --overwrite
          rm -f routes.osm.pbf
          python3 -I ../app/scripts/build-routes.py --relations-opl relations.opl --ways-geojsonseq ways.geojsonseq --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o ../out/routes-es.bin --summary ../routes-summary.json
          cat ../routes-summary.json
          ls -l ../out/routes-es.bin

      - name: Bike-share stations file (optional; skipped while the converter is not on the app's default branch)
        if: env.EXISTS != '1'
        continue-on-error: true
        run: |
          if [ ! -f app/scripts/build-bikeshare.py ]; then echo "build-bikeshare.py not available; skipping"; exit 0; fi
          mkdir -p bikeshare
          # One public GBFS station_information file per confirmed system (Bicing, BiciMAD; list and licences in
          # docs/phase2/bike-share.md of the app repo). One request each, no key.
          python3 -I app/scripts/build-bikeshare.py --print-urls | while read -r id url; do
            curl -sSL --compressed --connect-timeout 30 --max-time 120 --retry 3 -o "bikeshare/$id.json" "$url" || rm -f "bikeshare/$id.json"
          done
          # The script writes nothing (and exits 1) when no system has usable stations, so an empty file is never published.
          python3 -I app/scripts/build-bikeshare.py --input-dir bikeshare --generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o out/bikeshare-es.bin --summary bikeshare-summary.json
          cat bikeshare-summary.json
          ls -l out/bikeshare-es.bin

      - name: Catalog
        if: env.EXISTS != '1'
        run: |
          B="https://github.com/${{ github.repository }}/releases/download/${TAG}/"
          gen() {
            # $1 = extra transit arguments (may be empty)
            python3 -I app/scripts/gen-region-catalog.py --mwm-dir mwm --pmtiles-dir out \
              --mwm-url-by-slug --mwm-base "$B" --pmtiles-base "$B" --base-dir out --base-url "$B" \
              $( [ -f out/speedcams-es.bin ] && echo "--cameras-file out/speedcams-es.bin --cameras-base $B" ) \
              $( [ -f out/chargers-es.bin ] && echo "--chargers-file out/chargers-es.bin --chargers-base $B" ) \
              $( [ -f out/zbe-es.bin ] && echo "--zbe-file out/zbe-es.bin --zbe-base $B" ) \
              $( [ -f out/routes-es.bin ] && echo "--routes-file out/routes-es.bin --routes-base $B" ) \
              $( [ -f out/bikeshare-es.bin ] && echo "--bikeshare-file out/bikeshare-es.bin --bikeshare-base $B" ) \
              $1 -o out/catalog.json
          }
          # every transit index that has its sidecar (Madrid and the NAP cities that were built)
          TR=""
          for f in out/transit-*.umti; do
            if [ -f "$f" ] && [ -f "${f%.umti}.json" ]; then TR="$TR --transit-file $f"; fi
          done
          if [ -n "$TR" ]; then TR="$TR --transit-base $B"; fi
          # Transit must never block the map release: if the catalog cannot be generated with the transit
          # entries, drop the transit files and generate it again without them.
          if ! gen "$TR"; then
            [ -n "$TR" ] || exit 1
            echo "::warning::catalog generation failed with the transit entries; publishing without transit"
            echo "Catalog generation failed with transit entries: transit left out of this release." >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            rm -f out/transit-*.umti out/transit-*.json
            gen ""
          fi
          python3 -I - <<'PY'
          import json
          c = json.load(open("out/catalog.json"))
          def leaves(rs):
              for r in rs:
                  if "assets" in r: yield r
          n = sum(1 for _ in leaves(c["regions"]))
          print("downloadable regions:", n)
          assert n >= 20, "too few downloadable regions"
          assert "base" in c, "catalog without base"
          print("transit entries:", [(t["id"], t["size"], t["validFrom"], t["validTo"]) for t in c.get("transit", [])])
          PY
          (cd out && sha256sum * > SHA256SUMS)
          grep -E "transit-" out/SHA256SUMS || echo "no transit files in this release"

      - name: Dry run result (nothing is published)
        if: env.EXISTS != '1' && github.event.inputs.dry_run == 'true'
        run: |
          mkdir -p dryrun
          cp out/catalog.json out/SHA256SUMS dryrun/
          cp out/transit-* dryrun/ 2>/dev/null || true
          cp transit-build.log transit-gate.log transit-madrid-report.json dryrun/ 2>/dev/null || true
          cp ./*-summary.json dryrun/ 2>/dev/null || true
          echo "Dry run: no release was created and no release was pruned (would have been tag ${TAG%-dryrun})." | tee -a "${GITHUB_STEP_SUMMARY:-/dev/null}"
          ls -l dryrun

      - uses: actions/upload-artifact@v4
        if: env.EXISTS != '1' && github.event.inputs.dry_run == 'true'
        with:
          name: dry-run-${{ github.run_id }}
          path: dryrun/
          retention-days: 7

      - name: Publish release and prune old ones
        if: env.EXISTS != '1' && github.event.inputs.dry_run != 'true'
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --prerelease=false --latest \
            --title "Data ${MWM_V} (Protomaps ${PM_DATE})" \
            --notes "Spain regions (PMTiles from Protomaps build ${PM_DATE}, CoMaps maps ${MWM_V}, CoMaps ${COMAPS_TAG}) plus the world base. Data © OpenStreetMap contributors (ODbL). Bike-share station lists: Ajuntament de Barcelona (Open Data BCN) and Empresa Municipal de Transportes de Madrid (datos.madrid.es), CC BY 4.0. Generated by the weekly workflow." \
            ../out/*
          # Keep only the newest KEEP_RELEASES data releases (the one just published is always kept).
          gh release list --limit 100 --json tagName,createdAt \
            -q '[.[]|select(.tagName|startswith("data-"))]|sort_by(.createdAt)|reverse|.['"$KEEP_RELEASES"':][]|.tagName' |
          while read -r old; do
            [ "$old" = "$TAG" ] && continue
            echo "Deleting $old"; gh release delete "$old" --cleanup-tag --yes
          done
